name: Build arm64 iOS dylib
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Randomblock1/theos-action@v1
      - name: Build tweak
        run: |
          make clean
          make FINALPACKAGE=1
          find .theos/obj -name 'StandoffMod.dylib' -print
      - name: Collect dylib
        run: |
          mkdir -p output
          find .theos/obj -name 'StandoffMod.dylib' -exec cp {} output/ \;
          test -s output/StandoffMod.dylib
          file output/StandoffMod.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: StandoffMod-ios-arm64-dylib
          path: output/StandoffMod.dylib
